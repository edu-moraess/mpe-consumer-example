[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpe-consumer-example"
version = "0.1.0"
description = "External microconsumer validation probe for MPE 0.3.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  # MPE is installed separately as an external editable/package dependency.
  # Example: pip install -e /path/to/multimodal-perception-engine
  # Or: pip install git+https://github.com/edu-moraess/multimodal-perception-engine.git@5b3970bcef2da6bc7b3e4993da928025b0eccc67
]

[tool.setuptools.packages.find]
where = ["src"]
